<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学会調査</title>
</head>
<body>
    <table>
    <tr>
        <th>学会名</th>
        <th>場所</th>
        <th>日程</th>
        <th>学会URL</th>
        <th>最終更新</th>
    </tr>
    {% for conference in conferences %}
    <tr>
        <td>{{ conference.conference_name }}</td>
        <td>{{ conference.location | default("未取得") }}</td>
        <td>{{ conference.start_date | date_format(conference.end_date) }}</td>
        <td><a href="{{ conference.url }}" target="_blank">詳細</a></td>
        <td>{{ conference.checked_at | jst_format }}</td>
    </tr>
    {% endfor %}
    </table>
</body>
</html>
